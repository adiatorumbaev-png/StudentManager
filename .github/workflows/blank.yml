name: Deploy Greeting Page

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Создать index.html
        run: |
          mkdir site
          cat > site/index.html << EOF
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <title>Привет</title>
          </head>
          <body>
            <h1>Привет! Сайт обновлён через GitHub Actions</h1>
            <p>Автор: ${{ github.actor }}</p>
            <p>Ветка: ${{ github.ref_name }}</p>
            <p>Время: $(date '+%d.%m.%Y %H:%M:%S')</p>
          </body>
          </html>
          EOF

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить файлы сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
