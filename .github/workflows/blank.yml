name: Deploy Greeting Page

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Pages
        uses: actions/configure-pages@v5

      - name: Загрузить файлы сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Отправить ссылку в WhatsApp
        env:
          API_URL: ${{ secrets.GREEN_API_URL }}
          ID: ${{ secrets.GREEN_ID_INSTANCE }}
          TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          TEXT: |
            ✅ Сайт обновлён!
            Автор: ${{ github.actor }}
            Коммит: ${{ github.event.head_commit.message }}
            Ссылка: ${{ needs.deploy.outputs.page_url }}
        run: |
          jq -n --arg chat "$CHAT_ID" --arg msg "$TEXT" \
            '{chatId: $chat, message: $msg}' > body.json
          curl -sf -X POST "$API_URL/waInstance$ID/sendMessage/$TOKEN" \
            -H "Content-Type: application/json" \
            -d @body.json 
